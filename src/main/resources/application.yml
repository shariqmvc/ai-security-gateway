personal:
  security:
    chat:
      hard-rules-enabled: ${PERSONAL_CHAT_HARD_RULES_ENABLED:false}
    firewall:
      enabled: ${PERSONAL_SECURITY_FIREWALL_ENABLED:true}
      base-url: ${PERSONAL_SECURITY_FIREWALL_URL:http://localhost:8090}
      connect-timeout-ms: ${PERSONAL_SECURITY_FIREWALL_CONNECT_TIMEOUT_MS:500}
      read-timeout-ms: ${PERSONAL_SECURITY_FIREWALL_READ_TIMEOUT_MS:5000}
      fail-open: ${PERSONAL_SECURITY_FIREWALL_FAIL_OPEN:false}
      max-text-length: ${PERSONAL_SECURITY_FIREWALL_MAX_TEXT_LENGTH:20000}
server:
  port: ${SERVER_PORT:8080}

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    # Local Java process -> Docker PostgreSQL published on localhost:5433.
    # Override DB_HOST/DB_PORT/DB_NAME/DB_USERNAME/DB_PASSWORD when needed.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:aegisai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  servlet:
    multipart:
      max-file-size: ${RAG_INGESTION_MAX_FILE_SIZE:20MB}
      max-request-size: ${RAG_INGESTION_MAX_FILE_SIZE:20MB}
  config:
    import: classpath:firewall-patterns.yml

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: ${SPRING_JPA_SHOW_SQL:false}

    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

logging:
  pattern:
    console: "%d %-5level [%X{requestId}] %logger - %msg%n"

  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:INFO}

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-5
  url: https://api.openai.com/v1/responses

gemini:
  api:
    key: ${GEMINI_API_KEY}

  base:
    url: https://generativelanguage.googleapis.com

  model: gemini-3.6-flash

ollama:
  base:
    url: http://localhost:11434
  # Backward-compatible default model used when a request does not select one.
  model: ${OLLAMA_MODEL:llama3.1:8b}
  # Models exposed to Alroute's provider/model registry. The first entry
  # remains the default; additional models can be selected per request.
  models:
    - ${OLLAMA_MODEL:llama3.1:8b}
    - ${OLLAMA_MODEL_2:llama3.2:3b}
  # Keep the local model resident between requests and cap generation so
  # provider latency cannot grow without bound. Override per environment.
  keep-alive: ${OLLAMA_KEEP_ALIVE:10m}
  num-ctx: ${OLLAMA_NUM_CTX:4096}
  num-predict: ${OLLAMA_NUM_PREDICT:512}

aegis:
  security:
    platform:
      # Bootstrap credential for the first platform owner. Leave blank and use
      # a managed secret in production. It uses the same X-API-Key header.
      bootstrap-api-key: ${AEGIS_PLATFORM_API_KEY:}

security:
  encryption:
    aes-key: ${AES_KEY:mysecretkey12345}
gateway:
  context:
    optimization:
      # Provider-neutral, pre-provider context optimization.
      # The optimizer is a no-op below the configured threshold and
      # deterministically prunes duplicate/middle context above the budget.
      enabled: ${CONTEXT_OPTIMIZATION_ENABLED:true}
      max-input-tokens: ${CONTEXT_OPTIMIZATION_MAX_INPUT_TOKENS:16000}
      min-input-tokens: ${CONTEXT_OPTIMIZATION_MIN_INPUT_TOKENS:2000}
      minimum-savings-tokens: ${CONTEXT_OPTIMIZATION_MINIMUM_SAVINGS_TOKENS:128}
      prefix-tokens: ${CONTEXT_OPTIMIZATION_PREFIX_TOKENS:2000}
      suffix-tokens: ${CONTEXT_OPTIMIZATION_SUFFIX_TOKENS:5000}
      max-segments: ${CONTEXT_OPTIMIZATION_MAX_SEGMENTS:400}

  personal:
    quota:
      # Personal quota enforcement. A limit of 0 means unlimited.
      # Values are environment-overridable so commercial limits can be frozen without code changes.
      enabled: ${GATEWAY_PERSONAL_QUOTA_ENABLED:true}
      requests-per-minute: ${GATEWAY_PERSONAL_REQUESTS_PER_MINUTE:0}
      requests-per-day: ${GATEWAY_PERSONAL_REQUESTS_PER_DAY:0}
      monthly-token-quota: ${GATEWAY_PERSONAL_MONTHLY_TOKEN_QUOTA:0}
      max-input-tokens: ${GATEWAY_PERSONAL_MAX_INPUT_TOKENS:0}
      max-output-tokens: ${GATEWAY_PERSONAL_MAX_OUTPUT_TOKENS:0}
      max-concurrent-requests: ${GATEWAY_PERSONAL_MAX_CONCURRENT_REQUESTS:0}
  cache:
    exact:
      enabled: ${GATEWAY_CACHE_EXACT_ENABLED:true}
      maximum-size: ${GATEWAY_CACHE_EXACT_MAXIMUM_SIZE:10000}
      ttl: ${GATEWAY_CACHE_EXACT_TTL:10m}
  tenant-schema:
    migration:
      reconcile-on-startup: ${GATEWAY_TENANT_SCHEMA_RECONCILE_ON_STARTUP:true}
  multimodal:
    remote-media:
      # Public HTTPS media URLs are resolved by the gateway and translated to
      # provider-native inline media. HTTP is disabled by default.
      allow-http: ${GATEWAY_MULTIMODAL_REMOTE_MEDIA_ALLOW_HTTP:false}
      max-bytes: ${GATEWAY_MULTIMODAL_REMOTE_MEDIA_MAX_BYTES:15000000}
      connect-timeout: ${GATEWAY_MULTIMODAL_REMOTE_MEDIA_CONNECT_TIMEOUT:5s}
      read-timeout: ${GATEWAY_MULTIMODAL_REMOTE_MEDIA_READ_TIMEOUT:15s}

  provider:

    http:
      connect-timeout: ${GATEWAY_PROVIDER_CONNECT_TIMEOUT:5s}
      read-timeout: ${GATEWAY_PROVIDER_READ_TIMEOUT:30s}

      providers:
        GEMINI:
          connect-timeout: ${GATEWAY_GEMINI_CONNECT_TIMEOUT:5s}
          read-timeout: ${GATEWAY_GEMINI_READ_TIMEOUT:15s}

        OPENAI:
          connect-timeout: ${GATEWAY_OPENAI_CONNECT_TIMEOUT:5s}
          read-timeout: ${GATEWAY_OPENAI_READ_TIMEOUT:30s}

        OLLAMA:
          connect-timeout: ${GATEWAY_OLLAMA_CONNECT_TIMEOUT:2s}
          read-timeout: ${GATEWAY_OLLAMA_READ_TIMEOUT:60s}

    concurrency:
      providers:
        OLLAMA:
          max-concurrent: ${GATEWAY_OLLAMA_MAX_CONCURRENT:0}
          acquire-timeout: ${GATEWAY_OLLAMA_CONCURRENCY_ACQUIRE_TIMEOUT:0s}

  rate-limit:
    requests-per-minute: 60
  routing:
    failover:
      enabled: ${GATEWAY_ROUTING_FAILOVER_ENABLED:false}
      max-attempts: ${GATEWAY_ROUTING_FAILOVER_MAX_ATTEMPTS:2}
      request-time-budget: ${GATEWAY_ROUTING_FAILOVER_REQUEST_TIME_BUDGET:75s}
      minimum-fallback-budget: ${GATEWAY_ROUTING_FAILOVER_MINIMUM_FALLBACK_BUDGET:1s}
      circuit-breaker:
        enabled: ${GATEWAY_ROUTING_FAILOVER_CIRCUIT_BREAKER_ENABLED:true}
        failure-threshold: ${GATEWAY_ROUTING_FAILOVER_CIRCUIT_BREAKER_FAILURE_THRESHOLD:1}
        default-open-duration: ${GATEWAY_ROUTING_FAILOVER_CIRCUIT_BREAKER_DEFAULT_OPEN_DURATION:60s}
        timeout-open-duration: ${GATEWAY_ROUTING_FAILOVER_CIRCUIT_BREAKER_TIMEOUT_OPEN_DURATION:60s}
        network-open-duration: ${GATEWAY_ROUTING_FAILOVER_CIRCUIT_BREAKER_NETWORK_OPEN_DURATION:30s}
        rate-limit-open-duration: ${GATEWAY_ROUTING_FAILOVER_CIRCUIT_BREAKER_RATE_LIMIT_OPEN_DURATION:15s}
        server-error-open-duration: ${GATEWAY_ROUTING_FAILOVER_CIRCUIT_BREAKER_SERVER_ERROR_OPEN_DURATION:30s}
      providers:
        GEMINI:
          - OLLAMA
        OPENAI:
          - GEMINI
        OLLAMA:
          - GEMINI
      failure-injection:
        # Controlled runtime failure injection for 6.7 validation.
        # MUST remain disabled outside local/integration testing.
        enabled: ${ROUTING_FAILURE_INJECTION_ENABLED:false}
        provider: ${ROUTING_FAILURE_INJECTION_PROVIDER:}
        model: ${ROUTING_FAILURE_INJECTION_MODEL:}
        failure-type: ${ROUTING_FAILURE_INJECTION_TYPE:PROVIDER_ERROR}

    # Phase 9 model capability registry. Override per deployment/model.
    # The registry starts with the configured provider default model.
    model-capabilities:
      openai: ${GATEWAY_OPENAI_MODEL_CAPABILITIES:VISION,AUDIO,TOOLS,REASONING}
      gemini: ${GATEWAY_GEMINI_MODEL_CAPABILITIES:VISION,AUDIO,TOOLS,REASONING}
      ollama: ${GATEWAY_OLLAMA_MODEL_CAPABILITIES:}
      claude: ${GATEWAY_CLAUDE_MODEL_CAPABILITIES:VISION,AUDIO,TOOLS,REASONING}

    # Model-aware context budgets. Exact model entries override provider defaults.
    context-windows:
      default-tokens: ${GATEWAY_CONTEXT_DEFAULT_TOKENS:16000}
      providers:
        OPENAI: ${GATEWAY_OPENAI_CONTEXT_WINDOW:128000}
        GEMINI: ${GATEWAY_GEMINI_CONTEXT_WINDOW:128000}
        OLLAMA: ${OLLAMA_NUM_CTX:4096}
        CLAUDE: ${GATEWAY_CLAUDE_CONTEXT_WINDOW:200000}
      models: {}

    scoring:
      weights:
        cost: 0.30
        latency: 0.25
        availability: 0.20
        policy-preference: 0.25
      defaults:
        latency-ms: 1000
        availability: 1.0
      latency-ms: {}
      availability: {}

    optimization:
      enabled: ${ROUTING_OPTIMIZATION_ENABLED:true}
      degraded-availability-boost: ${ROUTING_OPTIMIZATION_DEGRADED_BOOST:1.25}
      unhealthy-availability-boost: ${ROUTING_OPTIMIZATION_UNHEALTHY_BOOST:1.35}
      latency-priority-boost: ${ROUTING_OPTIMIZATION_LATENCY_BOOST:1.15}
      cost-priority-boost: ${ROUTING_OPTIMIZATION_COST_BOOST:1.15}
      reliability-priority-boost: ${ROUTING_OPTIMIZATION_RELIABILITY_BOOST:1.15}
    health:
      enabled: ${ROUTING_HEALTH_ENABLED:true}
      reject-unhealthy: ${ROUTING_HEALTH_REJECT_UNHEALTHY:true}
      min-observations: ${ROUTING_HEALTH_MIN_OBSERVATIONS:3}
      consecutive-failure-threshold: ${ROUTING_HEALTH_CONSECUTIVE_FAILURE_THRESHOLD:3}
      degraded-availability: ${ROUTING_HEALTH_DEGRADED_AVAILABILITY:0.90}
      unhealthy-availability: ${ROUTING_HEALTH_UNHEALTHY_AVAILABILITY:0.70}
      ewma-alpha: ${ROUTING_HEALTH_EWMA_ALPHA:0.20}
      signal-ttl-seconds: ${ROUTING_HEALTH_SIGNAL_TTL_SECONDS:300}

    unity:
      enabled: false

rag:
  enabled: ${RAG_ENABLED:true}
  defaults:
    vector-store: ${RAG_VECTOR_STORE:PGVECTOR}
    chunking-strategy: ${RAG_CHUNKING_STRATEGY:TOKEN_AWARE}
    retrieval-strategy: ${RAG_RETRIEVAL_STRATEGY:HYBRID}
    top-k: ${RAG_TOP_K:5}
  embedding:
    enabled: ${RAG_EMBEDDING_ENABLED:true}
    batch-size: ${RAG_EMBEDDING_BATCH_SIZE:8}
    default-provider: ${RAG_EMBEDDING_DEFAULT_PROVIDER:OLLAMA}
    ollama-model: ${RAG_OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    ollama-keep-alive: ${RAG_OLLAMA_EMBEDDING_KEEP_ALIVE:2m}
    openai-model: ${RAG_OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    gemini-model: ${RAG_GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
  ingestion:
    max-file-size-bytes: ${RAG_INGESTION_MAX_FILE_SIZE_BYTES:20971520}
    max-extracted-characters: ${RAG_INGESTION_MAX_EXTRACTED_CHARACTERS:2000000}
    chunk-size-tokens: ${RAG_INGESTION_CHUNK_SIZE_TOKENS:512}
    chunk-overlap-tokens: ${RAG_INGESTION_CHUNK_OVERLAP_TOKENS:64}
    max-chunks: ${RAG_INGESTION_MAX_CHUNKS:10000}
    temp-directory: ${RAG_INGESTION_TEMP_DIRECTORY:${java.io.tmpdir}/aegisai-rag}
    allowed-extensions:
      - pdf
      - docx
      - md
      - markdown
      - txt
      - html
      - htm
      - json
      - csv

# AIRoute Personal v1 identity foundation.
alroute:
  personal:
    auth:
      session-ttl: ${ALROUTE_PERSONAL_SESSION_TTL:30d}
      verification-ttl: ${ALROUTE_PERSONAL_VERIFICATION_TTL:24h}
      # Keep false in production. Enable only for local/integration testing
      # when an email delivery adapter is not configured.
      auto-verify-on-signup: ${ALROUTE_PERSONAL_AUTO_VERIFY_ON_SIGNUP:false}
      # Keep false in production. When enabled, signup returns a one-time
      # verification token to support local dogfooding without email delivery.
      expose-verification-token: ${ALROUTE_PERSONAL_EXPOSE_VERIFICATION_TOKEN:false}

    # Personal feature entitlements are intentionally separate from Business
    # tenant entitlements. Business tenant authorization continues to use
    # tenantId/schema. This list does not create a Business tenant.
    features:
      enabled:
        - OPENAI
        - GEMINI
        - CLAUDE
        - OLLAMA
        - CHAT
        - STREAMING
        - EMBEDDING
        - PROMPT_FIREWALL
        - POLICY_ENGINE
        - PII_DETECTION
        - AUDIT
        - METRICS
        - TOKEN_ANALYTICS
        - COST_ANALYTICS
        - RATE_LIMITING
        - QUOTA
        - RAG
        - MCP
        - EXTENSIVE_RESEARCH
        - DASHBOARD

    billing:
      # Personal FREE is intentionally limited to locally hosted Ollama models.
      # Override ALROUTE_PERSONAL_FREE_MODELS per environment when the local
      # Ollama catalog differs.
      free-models: ${ALROUTE_PERSONAL_FREE_MODELS:OLLAMA:llama3.1:8b,OLLAMA:llama3.2:3b}
      reserve-output-tokens: ${ALROUTE_PERSONAL_RESERVE_OUTPUT_TOKENS:1024}
      reservation-multiplier: ${ALROUTE_PERSONAL_RESERVATION_MULTIPLIER:1.25}
      minimum-credit-charge: ${ALROUTE_PERSONAL_MINIMUM_CREDIT_CHARGE:0.01}

    payment:
      provider: ${ALROUTE_PERSONAL_PAYMENT_PROVIDER:EXTERNAL}
      currency: ${ALROUTE_PERSONAL_PAYMENT_CURRENCY:USD}
      webhook-secret: ${ALROUTE_PERSONAL_PAYMENT_WEBHOOK_SECRET:change-me-local-only}
      packages:
        starter:
          amount: ${ALROUTE_PERSONAL_STARTER_PACKAGE_AMOUNT:5}
          credits: ${ALROUTE_PERSONAL_STARTER_PACKAGE_CREDITS:5}

    providers:
      # Provider endpoints are system-level infrastructure configuration.
      # Personal credentials and Personal model choices are stored in the DB.
      openai:
        base-url: ${ALROUTE_PERSONAL_OPENAI_BASE_URL:https://api.openai.com}
      gemini:
        base-url: ${ALROUTE_PERSONAL_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      anthropic:
        base-url: ${ALROUTE_PERSONAL_ANTHROPIC_BASE_URL:https://api.anthropic.com}


spring:
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
