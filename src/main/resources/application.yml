server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/db_gateway
    username: postgres
    password: shariq
  config:
    import: classpath:firewall-patterns.yml

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

logging:
  pattern:
    console: "%d %-5level [%X{requestId}] %logger - %msg%n"

  level:
    org.hibernate.SQL: DEBUG

